<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>پنل ادمین گیم‌استور</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
body{margin:0;background:#06122b;color:#eef6ff;font-family:Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:1000px;margin:auto;padding:16px}
h1{color:#60a5fa;font-size:1.4rem}
.box{background:#0f2347;border:1px solid #1e3a6e;border-radius:12px;padding:14px;margin-bottom:12px}
input,textarea,select{background:#06122b;color:#eef6ff;border:1px solid #1e3a6e;border-radius:8px;padding:8px;margin:3px;font-family:inherit}
button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;margin:2px;font-family:inherit}
button.g{background:transparent;border:1px solid #1e3a6e}
.hidden{display:none!important}
.chatlay{display:grid;grid-template-columns:1fr 2fr;gap:10px}
@media(max-width:700px){.chatlay{grid-template-columns:1fr}}
.item{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #1e3a6e;cursor:pointer}
.item.on{background:#16315f}
.dot{width:10px;height:10px;border-radius:50%;background:#64748b;display:inline-block;flex:none}
.dot.on{background:#22c55e}
#msgs{height:320px;overflow-y:auto;background:#0a1a38;border-radius:10px;padding:8px}
.b{background:#16315f;border-radius:10px;padding:6px 10px;margin:6px 0;max-width:80%}
.b.me{background:#2563eb;margin-inline-start:auto}
.row2{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border-bottom:1px solid #1e3a6e;padding:8px 0}
small{color:#93b4e0;display:block}
</style>
</head>
<body>
<div class="wrap">
<h1>پنل ادمین گیم‌استور</h1>
<a href="index.html" style="color:#60a5fa;text-decoration:none;display:inline-block;margin-bottom:10px">← بازگشت به سایت (حالت مشتری)</a>

<div id="login" class="box" style="max-width:380px">
  <p>برای ورود، با ایمیلی که دعوت شدی وارد شو.</p>
  <button onclick="netlifyIdentity.open('login')">ورود</button>
</div>

<div id="app" class="hidden">
  <div style="margin-bottom:10px">
    <button onclick="tab('chat')">چت</button>
    <button onclick="tab('prices')">قیمت‌ها</button>
    <button onclick="tab('offers')">آفرها</button>
    <button onclick="tab('rules')">قوانین</button>
    <button onclick="tab('tickets')">تیکت‌ها</button>
    <button class="g" onclick="netlifyIdentity.logout()">خروج</button>
    <span id="onlineCount" style="margin-right:10px"></span>
  </div>

  <div id="t-chat" class="box chatlay">
    <div id="chatList"></div>
    <div>
      <div id="msgs"></div>
      <div style="margin-top:8px;display:flex;gap:6px">
        <input id="reply" style="flex:1" placeholder="جواب بنویس">
        <button onclick="sendMsg()">ارسال</button>
      </div>
    </div>
  </div>

  <div id="t-prices" class="box hidden">
    <div id="prices"></div>
    <h3>بسته‌ی جدید</h3>
    <div class="row2">
      <input id="np_cp" placeholder="سی‌پی" size="6">
      <input id="np_price" placeholder="قیمت (تومان)" size="10">
      <input id="np_tag" placeholder="برچسب" size="14">
      <input id="np_disc" placeholder="تخفیف %" value="0" size="4">
      <button onclick="addPrice()">افزودن</button>
    </div>
  </div>

  <div id="t-offers" class="box hidden">
    <div id="offers"></div>
    <h3>آفر جدید</h3>
    <div class="row2">
      <input id="no_title" placeholder="عنوان">
      <input id="no_desc" placeholder="توضیح">
      <input id="no_price" placeholder="قیمت" size="10">
      <button onclick="addOffer()">افزودن</button>
    </div>
  </div>

  <div id="t-rules" class="box hidden">
    <textarea id="rules" rows="12" style="width:100%"></textarea>
    <button onclick="saveRules()">ذخیره‌ی قوانین</button>
  </div>

  <div id="t-tickets" class="box hidden"><div id="tickets"></div></div>
</div>
</div>

<script>
const API = '/.netlify/functions/api';
let S = null, token = null, currentChat = null, timer = null;
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function api(action, data){
  const r = await fetch(API + '?action=' + action, {
    method: data ? 'POST' : 'GET',
    headers: {'Content-Type':'application/json', 'Authorization': 'Bearer ' + token},
    body: data ? JSON.stringify(data) : undefined
  });
  return r.json();
}

netlifyIdentity.on('init', u => { if (u) afterLogin(u); else $('login').classList.remove('hidden'); });
netlifyIdentity.on('login', u => { netlifyIdentity.close(); afterLogin(u); });
netlifyIdentity.on('logout', () => location.reload());
netlifyIdentity.init();

async function afterLogin(u){
  const roles = (u.app_metadata && u.app_metadata.roles) || [];
  if (!roles.includes('admin')){
    alert('این حساب دسترسی ادمین نداره.');
    netlifyIdentity.logout();
    return;
  }
  token = await u.jwt();
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  tab('chat');
  loadAll();
  timer = setInterval(loadAll, 10000);
}

async function loadAll(){
  const d = await api('admin_data');
  if (d.error){ $('login').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
  S = d.state;
  $('onlineCount').textContent = 'آنلاین: ' + d.online.length;
  renderChats(d.chats, d.online);
  renderTickets(d.tickets);
  if (!$('t-prices').classList.contains('hidden')) renderPrices();
  if (!$('t-offers').classList.contains('hidden')) renderOffers();
  if (!$('t-rules').classList.contains('hidden') && document.activeElement !== $('rules')) $('rules').value = S.rules || '';
  if (currentChat) renderMsgs();
}

function tab(n){
  ['chat','prices','offers','rules','tickets'].forEach(x => $('t-'+x).classList.toggle('hidden', x !== n));
  if (n==='prices') renderPrices();
  if (n==='offers') renderOffers();
  if (n==='rules') $('rules').value = S ? (S.rules||'') : '';
}

/* ---------- چت ---------- */
function renderChats(ids, online){
  $('chatList').innerHTML = ids.length ? ids.map(id =>
    `<div class="item ${id===currentChat?'on':''}" onclick="openChat('${id}')">
      <span class="dot ${online.includes(id)?'on':''}"></span>
      <div><b>مشتری ${esc(id.slice(0,6))}</b></div></div>`).join('') : '<p>هنوز گفتگویی نیست.</p>';
}
function openChat(id){ currentChat = id; renderMsgs(); }
async function renderMsgs(){
  const d = await api('admin_chat', {id: currentChat});
  $('msgs').innerHTML = (d.messages||[]).map(m => `<div class="b ${m.sender==='admin'?'me':''}">${esc(m.body)}</div>`).join('');
  $('msgs').scrollTop = 1e9;
}
async function sendMsg(){
  const v = $('reply').value.trim();
  if (!v || !currentChat) return;
  $('reply').value = '';
  await api('admin_reply', {id: currentChat, text: v});
  renderMsgs();
}

/* ---------- قیمت‌ها ---------- */
function rowVals(el){
  const o = {};
  el.querySelectorAll('[data-f]').forEach(i => { o[i.dataset.f] = i.type==='checkbox' ? i.checked : i.value; });
  return o;
}
function renderPrices(){
  if (!S) return;
  $('prices').innerHTML = S.prices.map((r,i) => `
    <div class="row2" data-i="${i}">
      <input data-f="cp" value="${r.cp}" size="6">
      <input data-f="price" value="${r.price}" size="10">
      <input data-f="tag" value="${esc(r.tag)}" size="14">
      <input data-f="discount" value="${r.discount||0}" size="4"> %
      <label><input type="checkbox" data-f="active" ${r.active!==false?'checked':''}> فعال</label>
      <button onclick="savePriceRow(this)">ذخیره</button>
      <button class="g" onclick="delPrice(${i})">حذف</button>
    </div>`).join('') || '<p>بسته‌ای نیست.</p>';
}
async function savePriceRow(btn){
  const row = btn.closest('.row2'); const v = rowVals(row);
  S.prices[+row.dataset.i] = { cp:+v.cp, price:+v.price, tag:v.tag, discount:+v.discount||0, active:v.active };
  await saveState(); renderPrices();
}
async function delPrice(i){ if (!confirm('این بسته حذف شه؟')) return; S.prices.splice(i,1); await saveState(); renderPrices(); }
async function addPrice(){
  S.prices.push({ cp:+$('np_cp').value, price:+$('np_price').value, tag:$('np_tag').value, discount:+$('np_disc').value||0, active:true });
  await saveState(); renderPrices();
}

/* ---------- آفرها ---------- */
function renderOffers(){
  if (!S) return;
  $('offers').innerHTML = S.offers.map((o,i) => `
    <div class="row2" data-i="${i}">
      <input data-f="title" value="${esc(o.title)}" size="20">
      <input data-f="description" value="${esc(o.description)}" size="25">
      <input data-f="price" value="${o.price||''}" size="10">
      <label><input type="checkbox" data-f="active" ${o.active!==false?'checked':''}> فعال</label>
      <button onclick="saveOfferRow(this)">ذخیره</button>
      <button class="g" onclick="delOffer(${i})">حذف</button>
    </div>`).join('') || '<p>آفری نیست.</p>';
}
async function saveOfferRow(btn){
  const row = btn.closest('.row2'); const v = rowVals(row);
  S.offers[+row.dataset.i] = { title:v.title, description:v.description, price:+v.price||null, active:v.active };
  await saveState(); renderOffers();
}
async function delOffer(i){ if (!confirm('این آفر حذف شه؟')) return; S.offers.splice(i,1); await saveState(); renderOffers(); }
async function addOffer(){
  S.offers.push({ title:$('no_title').value, description:$('no_desc').value, price:+$('no_price').value||null, active:true });
  await saveState(); renderOffers();
}

/* ---------- قوانین ---------- */
async function saveRules(){ S.rules = $('rules').value; await saveState(); alert('قوانین ذخیره شد'); }

async function saveState(){
  await api('admin_save', {state: S});
}

/* ---------- تیکت‌ها ---------- */
function renderTickets(list){
  $('tickets').innerHTML = (list||[]).map(t => `
    <div class="row2">
      <b>${esc(t.name||'بدون نام')}</b>
      <small>${new Date(t.at).toLocaleString('fa-IR')}</small>
      <div style="width:100%">${esc(t.message)}</div>
      <select onchange="setStatus('${t.id}', this.value)">
        <option value="new" ${t.status!=='done'?'selected':''}>جدید</option>
        <option value="done" ${t.status==='done'?'selected':''}>انجام شد</option>
      </select>
    </div>`).join('') || '<p>تیکتی نیست.</p>';
}
async function setStatus(id, s){ await api('admin_ticket', {id, status:s}); }
</script>
</body>
</html>
